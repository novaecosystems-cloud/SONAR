<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sonar AI Mobile App</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060A12">
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      background: #060a12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(10, 17, 32, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 360px;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #06b6d4;
      color: #000;
      font-weight: bold;
      border-radius: 16px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin: 0 0 10px 0; color: #06b6d4;">SONAR AI MOBILE</h2>
    <p style="color: #9ca3af; font-size: 13px;">Ambient Voice Super-Agent for Android & iOS</p>
    <a href="https://sonar-ai.vercel.app" class="btn">Launch Sonar Mobile App</a>
  </div>
  <script>
    window.location.href = "https://sonar-ai.vercel.app";
  </script>
</body>
</html>
